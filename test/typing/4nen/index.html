<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>【テスト】タイピング練習　4年生｜さくらツール</title>
<!-- 🔴 転送だけの入口（2026-09-08）。中身は ../index.html 1本のまま。
     ⭐先生はこのURLだけ配ればいい。⚠?kids=1 付きのURLはダブルクリックで開けないので、その代わりでもある -->
<script>location.replace("../index.html?kids=1&g=4");</script>
<meta http-equiv="refresh" content="0;url=../index.html?kids=1&g=4">
</head>
<body>
<div id="testBadge" style="position:fixed;right:6px;top:56px;z-index:9999;background:#c86a8e;color:#fff;font-size:11px;padding:3px 8px;border-radius:999px;opacity:.85" class="noprint">テスト版</div>
<script>
/* 🔴⭐テスト版の印は、文字ではなく自動で出す（2026-09-12 本人「アップするたびに、
   最終更新日が表示されるようにして」）。
   ⚠make_test.py が走った時刻を文字で埋め込む作りだった＝9/10のまま固まり、
     手で直しても変わらなかった＝どれが最新か分からなくなっていた。
   ⭐document.lastModified＝サーバーが返す「このHTMLが最後に変わった時刻」。
     UPすれば必ず動く。⚠make_test.py を走らせると文字の印に戻る（2026-09-12 未対応） */
(function(){
  var b = document.getElementById('testBadge');
  if(!b) return;
  var d = new Date(document.lastModified), z = function(n){ return (n<10?'0':'') + n; };
  b.textContent = 'テスト版 ' + z(d.getMonth()+1) + '/' + z(d.getDate()) +
                  ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
})();
</script>
<p><a href="../index.html?kids=1&g=4">タイピング練習（4年生）をひらく</a></p>
</body>
</html>
